resources:
  jobs:
    oaon_full_pipeline:

      name: OAON Full Pipeline

      tasks:

        - task_key: raw_load

          run_job_task:
            job_id: ${resources.jobs.oaon_raw_load.id}

        - task_key: bronze_load

          depends_on:
            - task_key: raw_load

          run_job_task:
            job_id: ${resources.jobs.oaon_bronze_load.id}

        - task_key: silver_load

          depends_on:
            - task_key: bronze_load

          run_job_task:
            job_id: ${resources.jobs.oaon_silver_load.id}
